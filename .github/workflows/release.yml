name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate manifest.json
        run: |
          if [ ! -f .claude-plugin/manifest.json ]; then
            echo "Error: manifest.json not found"
            exit 1
          fi

          # Check if jq is available, if not install it
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

          # Validate JSON syntax
          jq empty .claude-plugin/manifest.json

          # Extract and display plugin information
          echo "Plugin Name: $(jq -r '.name' .claude-plugin/manifest.json)"
          echo "Plugin Version: $(jq -r '.version' .claude-plugin/manifest.json)"
          echo "Plugin Description: $(jq -r '.description' .claude-plugin/manifest.json)"
          echo "Plugin Author: $(jq -r '.author' .claude-plugin/manifest.json)"

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify manifest.json version matches tag
        run: |
          TAG_VERSION="${{ steps.get_version.outputs.VERSION }}"
          MANIFEST_VERSION=$(jq -r '.version' .claude-plugin/manifest.json)
          
          echo "Tag version: $TAG_VERSION"
          echo "Manifest version: $MANIFEST_VERSION"
          
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "❌ Error: Version mismatch!"
            echo "The version in manifest.json ($MANIFEST_VERSION) does not match the tag ($TAG_VERSION)"
            echo ""
            echo "Please update .claude-plugin/manifest.json to version $TAG_VERSION and commit before creating the tag."
            exit 1
          fi
          
          echo "✓ Version verified: $TAG_VERSION"

      - name: Update or create CHANGE_LOG.md
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          DATE=$(date +%Y-%m-%d)
          TEMP_DIR="${{ runner.temp }}"
          
          # Generate release notes from commits since last tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --exclude="${{ github.ref_name }}" 2>/dev/null || echo "")
          
          if [ -z "$PREVIOUS_TAG" ]; then
            # First release - get all commits
            git log --pretty=format:"- %s" --no-merges > "${TEMP_DIR}/commits.txt"
          else
            # Get commits since previous tag
            git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s" --no-merges > "${TEMP_DIR}/commits.txt"
          fi
          
          # Create changelog entry
          {
            echo "## [$VERSION] - $DATE"
            echo ""
            echo "### Changes"
            cat "${TEMP_DIR}/commits.txt"
            echo ""
          } > "${TEMP_DIR}/changelog_entry.txt"
          
          # Check if CHANGE_LOG.md exists and is up to date
          if [ -f CHANGE_LOG.md ]; then
            # Check if this version already exists in changelog
            if grep -q "## \[$VERSION\]" CHANGE_LOG.md; then
              echo "✓ CHANGE_LOG.md already contains entry for version $VERSION"
            else
              echo "⚠️  Warning: CHANGE_LOG.md exists but doesn't contain entry for version $VERSION"
              echo "Consider updating CHANGE_LOG.md before tagging the release."
            fi
          else
            echo "⚠️  Warning: CHANGE_LOG.md does not exist"
            echo "Consider creating CHANGE_LOG.md before tagging the release."
          fi
          
          # Save generated changelog for release notes
          cat "${TEMP_DIR}/changelog_entry.txt" > "${TEMP_DIR}/release_notes.txt"
          echo "Generated release notes for version $VERSION"

      - name: Commit changelog if missing
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          TEMP_DIR="${{ runner.temp }}"
          
          # Only commit if CHANGE_LOG.md doesn't exist or doesn't have this version
          NEEDS_UPDATE=false
          
          if [ ! -f CHANGE_LOG.md ]; then
            NEEDS_UPDATE=true
            {
              echo "# Changelog"
              echo ""
              echo "All notable changes to this project will be documented in this file."
              echo ""
            } > CHANGE_LOG.md
            cat "${TEMP_DIR}/release_notes.txt" >> CHANGE_LOG.md
            echo "Created CHANGE_LOG.md"
          elif ! grep -q "## \[$VERSION\]" CHANGE_LOG.md; then
            NEEDS_UPDATE=true
            cat "${TEMP_DIR}/release_notes.txt" CHANGE_LOG.md > CHANGE_LOG.md.tmp
            mv CHANGE_LOG.md.tmp CHANGE_LOG.md
            echo "Updated CHANGE_LOG.md with version $VERSION"
          fi
          
          if [ "$NEEDS_UPDATE" = true ]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add CHANGE_LOG.md
            git commit -m "chore: add changelog entry for $VERSION [skip ci]"
            git push
            echo "✓ Committed CHANGE_LOG.md"
          else
            echo "✓ CHANGE_LOG.md is up to date"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Claude Plugin Release ${{ github.ref_name }}

            **Plugin:** kdccai-plugin
            **Version:** ${{ steps.get_version.outputs.VERSION }}

            This release contains the Claude Code plugin for KDC club activity management.

            ### Installation
            To install this plugin, use the following command in Claude Code:
            ```
            /plugin install https://github.com/mnthe/kdccai-plugin
            ```

            Or manually clone this repository to your `.claude/plugins` directory.

            ### Changes
            See [CHANGE_LOG.md](CHANGE_LOG.md) for detailed changes in this release.

            ---
          draft: false
          prerelease: false
